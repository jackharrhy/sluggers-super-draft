name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/starworks-platform
    env:
      DATABASE_URL: postgres://starworks:starworks@127.0.0.1:5432/starworks_test
      STARWORKS_TEST_DATABASE_URL: postgres://starworks:starworks@127.0.0.1:5432/starworks_test

    services:
      postgres:
        image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_DB: starworks_test
          POSTGRES_PASSWORD: starworks
          POSTGRES_USER: starworks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starworks -d starworks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: |
            experiments/starworks-platform/contracts/package-lock.json
            experiments/starworks-platform/web/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: experiments/starworks-platform/runner/uv.lock

      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix contracts
          npm ci --prefix web

      - name: Install browser test runtime
        run: npx --prefix web playwright install --with-deps chromium

      - name: Install runner dependencies
        run: uv sync --project runner --locked --group test

      - name: Lint runner
        run: |
          uvx ruff==0.16.2 format --check runner
          uvx ruff==0.16.2 check runner

      - name: Typecheck
        run: npm run typecheck

      - name: Validate shared contracts
        run: npm run contracts:check

      - name: Test Remix
        run: npm --prefix web test

      - name: Test PostgreSQL integrations
        run: |
          npm --prefix web run db:migrate
          npm --prefix web run test:db

      - name: Audit production JavaScript dependencies
        run: npm --prefix web audit --omit=dev --audit-level=high

      - name: Build and smoke-test runner wheel
        run: |
          uv build --project runner --wheel --out-dir dist/runner
          tool_dir="$(mktemp -d)"
          bin_dir="$(mktemp -d)"
          UV_TOOL_DIR="$tool_dir" UV_TOOL_BIN_DIR="$bin_dir" \
            uv tool install --python 3.12 --with 'pyside6>=6.10,<7' dist/runner/*.whl
          "$bin_dir/starworks-runner" validate-contracts

      - name: Validate Compose topologies
        run: |
          docker compose config --quiet
          docker compose --profile email config --quiet
          docker compose --profile operations config --quiet
          docker compose \
            --env-file deploy/prod/.env.example \
            -f deploy/prod/compose.yml \
            config --quiet
          docker compose \
            --env-file deploy/prod/.env.example \
            -f deploy/prod/compose.yml \
            --profile operations \
            config --quiet
          STARWORKS_RESTORE_DIR=/tmp docker compose \
            -f deploy/prod/restore-drill.compose.yml \
            config --quiet
          docker compose \
            --env-file deploy/runner/.env.example \
            -f deploy/runner/compose.yml \
            config --quiet

      - name: Validate runner image definition
        run: docker build --check --platform linux/amd64 -f deploy/runner/Dockerfile .

      - name: Build web image
        run: docker build --tag starworks-web:ci .

      - uses: actions/upload-artifact@v4
        with:
          name: starworks-runner-wheel
          path: experiments/starworks-platform/dist/runner/*.whl

  original-app:
    name: Original application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/sluggers-super-draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: apps/sluggers-super-draft/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  runner-platforms:
    name: Runner · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/starworks-platform
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: experiments/starworks-platform/runner/uv.lock

      - name: Install runner dependencies
        run: uv sync --project runner --locked --group test

      - name: Test runner on native host
        run: uv run --project runner --group test pytest -q

      - name: Build runner wheel on native host
        run: uv build --project runner --wheel --out-dir dist/runner
