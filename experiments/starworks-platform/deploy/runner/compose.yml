services:
  runner:
    build:
      context: ../..
      dockerfile: deploy/runner/Dockerfile
    image: starworks/runner-dolphin:2606
    platform: linux/amd64
    shm_size: "1gb"
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      PIXELFLUX_WAYLAND: "true"
      STARWORKS_URL: "${STARWORKS_URL:-http://host.docker.internal:3000}"
      STARWORKS_RUNNER_NAME: "${STARWORKS_RUNNER_NAME:-Container station}"
      STARWORKS_RTMP_URL_FILE: "/run/secrets/rtmp_url"
    devices:
      - "${STARWORKS_GPU_DEVICE:-/dev/dri}:/dev/dri"
      - "${STARWORKS_INPUT_DEVICE:-/dev/input}:/dev/input"
    volumes:
      - runner_config:/config
      - "${STARWORKS_DATA_DIRECTORY:-./data}:/starworks-data"
    secrets:
      - rtmp_url
    restart: unless-stopped

secrets:
  rtmp_url:
    file: "${STARWORKS_RTMP_SECRET_FILE:-./secrets/rtmp-url}"

volumes:
  runner_config:
