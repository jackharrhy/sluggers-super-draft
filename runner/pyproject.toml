[project]
name = "starworks-runner"
version = "0.1.0"
description = "Native runner and Mario Super Sluggers adapter for Starworks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "jsonschema[format]>=4.26.0,<5",
]

[project.scripts]
starworks-runner = "starworks_runner.cli:main"

[dependency-groups]
test = [
  "pytest>=9.0.0,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starworks_runner"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
